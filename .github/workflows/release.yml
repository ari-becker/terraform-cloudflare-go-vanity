name: Release

# Publishing a GitHub release pushes its tag, and both module registries pick
# up new version tags on their own. This workflow tests the release and
# confirms that both registries serve it. See RELEASING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: Check the release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      module: ${{ steps.tag.outputs.module }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tag \"$TAG\" isn't a version like v1.2.3. Delete the release and its tag, then release again with a tag like v1.2.3."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          # A repository named terraform-<provider>-<name> is published as
          # <owner>/<name>/<provider>.
          repo="${GITHUB_REPOSITORY#*/terraform-}"
          echo "module=${GITHUB_REPOSITORY_OWNER}/${repo#*-}/${repo%%-*}" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: version
    uses: ./.github/workflows/test.yml

  registry:
    name: ${{ matrix.registry.name }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.registry.timeout }}
    strategy:
      fail-fast: false
      matrix:
        registry:
          # Notified by a webhook when the tag is pushed, usually within a minute.
          - { name: Terraform Registry, host: registry.terraform.io, cli: terraform, timeout: 30 }
          # Checks for new tags every 15 minutes.
          - { name: OpenTofu Registry, host: registry.opentofu.org, cli: tofu, timeout: 120 }
    env:
      CLI: ${{ matrix.registry.cli }}
      HOST: ${{ matrix.registry.host }}
      MODULE: ${{ needs.version.outputs.module }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Wait for the registry to list the version
        run: |
          url="https://${HOST}/v1/modules/${MODULE}/versions"
          until curl -fsS "$url" 2>/dev/null | jq -e --arg v "$VERSION" 'any(.modules[].versions[]; .version == $v)' >/dev/null; do
            echo "${MODULE} ${VERSION} isn't on ${HOST} yet. Checking again in a minute."
            sleep 60
          done
          echo "${MODULE} ${VERSION} is on ${HOST}."

      - if: matrix.registry.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - if: matrix.registry.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Install the module from the registry
        run: |
          mkdir consumer && cd consumer
          cat > main.tf <<EOF
          module "go_vanity" {
            source  = "${HOST}/${MODULE}"
            version = "${VERSION}"
          }
          EOF
          "$CLI" init -input=false -backend=false
