name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to catch new Cloudflare provider releases that break the module.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - run: tofu fmt -check -recursive -diff

  worker:
    name: Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test
        working-directory: worker

  module:
    name: ${{ matrix.tool.name }} ${{ matrix.tool.version }}, provider ${{ matrix.provider }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported versions, from versions.tf, and the newest.
        tool:
          - { name: OpenTofu, cli: tofu, version: 1.8.11 }
          - { name: OpenTofu, cli: tofu, version: latest }
          - { name: Terraform, cli: terraform, version: 1.8.5 }
          - { name: Terraform, cli: terraform, version: latest }
        provider: ["5.26.0", latest]
    env:
      CLI: ${{ matrix.tool.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.tool.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.tool.version }}
          tofu_wrapper: false
      - if: matrix.tool.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.tool.version }}
          terraform_wrapper: false

      - name: Pin the Cloudflare provider to ${{ matrix.provider }}
        if: matrix.provider != 'latest'
        env:
          PROVIDER_VERSION: ${{ matrix.provider }}
        # Override files replace the provider constraint from versions.tf.
        run: |
          cat > ci_override.tf <<EOF
          terraform {
            required_providers {
              cloudflare = {
                source  = "cloudflare/cloudflare"
                version = "= ${PROVIDER_VERSION}"
              }
            }
          }
          EOF
          cp ci_override.tf examples/basic/ci_override.tf

      - name: Test the module
        run: |
          "$CLI" init -input=false
          "$CLI" validate
          "$CLI" test

      # Unlike the tests, which mock the provider, this runs the real
      # provider's validation. A plan that only creates resources makes no
      # Cloudflare API calls, so a placeholder token works.
      - name: Plan the example
        working-directory: examples/basic
        env:
          CLOUDFLARE_API_TOKEN: "0000000000000000000000000000000000000000"
        run: |
          "$CLI" init -input=false
          "$CLI" plan -input=false -var account_id=0123456789abcdef0123456789abcdef
